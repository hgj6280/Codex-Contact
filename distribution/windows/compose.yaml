services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      ACCOUNT: ${QQ_ACCOUNT:-}
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6099:6099"
    volumes:
      - ./app/modules/qq-napcat/state/config:/app/napcat/config
      - ./app/modules/qq-napcat/state/qq:/app/.config/QQ
